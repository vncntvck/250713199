<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"https://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <title>Form Pendaftaran Ekskul (XHTML)</title>
    <meta http-equiv="content-type" content="text/html; charset=utf-8"/>
    <script type="text/javascript">
        function fn_Valform(){
            var sMsg = "";
            if (document.getElementById("nama").value == ""){
                sMsg += "\n* Anda belum mengisi nama";
            }
            if(document.getElementById("kelas").value == ""){
                sMsg += "\n* Anda belum mengisi kelas";
            }
            if(document.getElementById("alasan").value == ""){
                sMsg += "\n* Anda belum mengisi alasan";
            }
            if(sMsg !=""){
                alert("Peringatan:\n" + sMsg);
                return false;
            }else{
                return true;
            }
        }
    </script>
</head>
<body>
    <h1>Form Pendaftaran Ekskul</h1>
    <form action="#" method="post" onsubmit="return fn_Valform();">
        <p>Nama :<br/><input type="text" name="nama" id="nama"/></p>
        <p>Kelas :<br/><input type="text" name="kelas" id="kelas"/></p>
        <p>Alasan Bergabung: 
            <br/><textarea name="alasan" id="alasan" rows="4" cols="30"></textarea><p>
        </p><input type="submit" value="Send"/></p>
    </form>
</body>
</html>
