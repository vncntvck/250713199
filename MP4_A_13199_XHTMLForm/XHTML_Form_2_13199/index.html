<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"https://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
    <head>
       <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <title>Formulir Pendaftaran Seminar</title>
    </head>
    <body>
        <h1>Formulir Pendaftaran Seminar</h1>
        <h2>Data Peserta</h2>
        <form action="" method="post" enctype="multipart/form-data">
            <table cellspacing="4" cellpadding="4" border="1" style="border-collapse: collapse;width: 100%;">
                <tr>
                    <td width="32%">
                        <label for="namamhs"><strong>Nama Lengkap</strong>
                        </label>
                    </td>
                    <td>
                        <input type="text" id="namamhs" name="namamhs" size="30" />
                    </td>
                </tr>
                <tr>
                    <td width="32%">
                        <label for="nim"><strong>NIM</strong>
                        </label>
                    </td>
                    <td>
                        <input type="text" id="nim" name="nim" size="30" />
                    </td>
                </tr>
                <tr>
                    <td width="32%">
                        <strong>Jenis Kelamin</strong>
                    </td>
                    <td>
                        <input type="radio" id="laki" name="jk" value="Laki-Laki" /><label for="laki">Laki-Laki</label>
                        <input type="radio" id="perempuan" name="jk" value="Perempuan" /><label for="perempuan">Perempuan</label>
                    </td>
                </tr>
                  <!-- Pilihan program studi menggunakan dropdown-->
                <tr>
                    <td width="32%">
                        <label for="prodi"><strong>Program Studi</strong>
                        </label>
                    </td>
                    <td>
                        <select id="prodi" name="prodi">
                            <option>Informatika</option>
                            <option>Sistem Informasi</option>
                            <option>Teknik Industri</option>
                        </select>
                    </td>
                </tr>
            </table>
        </form>
        <h2>Pilihan Seminar</h2>
        <form action="" method="post" enctype="multipart/form-data">
            <table cellspacing="4" cellpadding="4" border="1" style="border-collapse: collapse;width: 100%;">
                <tr>
                    <td width="32%">
                        <strong>Jenis Tiket</strong>
                    </td>
                    <td>
                        <input type="radio" id="Reguler" name="jk" value="Reguler" /><label for="Reguler">Reguler</label>
                        <input type="radio" id="VIP" name="jk" value="VIP" /><label for="VIP">VIP</label>
                    </td>
                </tr>
                <tr>
                    <td width="32%">
                        <strong>Topik Seminar</strong>
                    </td>
                    <td>
                        <p>
                            <input type="checkbox" id="WebDev" name="topik" value="WebDev" />
                            <label for="WebDev">Web Development</label><br />
                            <input type="checkbox" id="DataScience" name="topik" value="DataScience" />
                            <label for="DataScience">Data Science</label><br />
                            <input type="checkbox" id="AI" name="topik" value="AI" />
                            <label for="AI">Artificial Intelligence</label><br />
                            
                        </p>
                    </td>
                </tr>
            </table>
        </form>
        <h2>Informasi Tambahan</h2>
        <form method="post" enctype="multipart/form-data">
            <table cellspacing="4" cellpadding="4" border="1" style="border-collapse: collapse;width: 100%;">
               <tr>
                    <td style="vertical-align: center; width: 32%;">
                        <label for="resume">
                            <strong>Alasan Mengikuti Seminar</strong>
                        </label>
                    </td>
                    <td>
                        <textarea name="resume" id="resume" rows="10" cols="23"></textarea>
                    </td>
                </tr>
                <tr>
                    <td style="vertical-align: center; width: 32%;">
                        <label for="photo"><strong>Bukti Pembayaran</strong>
                        </label>
                    </td>
                    <td>
                        <input type="file" id="photo" name="photo" size="18" accept="image/gif, image/jpeg, image/png" />
                    </td>
                </tr>
                <tr>     
                    <td colspan="2" style="text-align: center; width:32%;">
                        <input type="submit" name="simpan" value="Simpan" />
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
